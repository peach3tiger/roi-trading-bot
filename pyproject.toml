[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
# MẶC ĐỊNH của pytest là `test_*.py` — và `tests/regression_harness.py`
# KHÔNG khớp, nên nó CHƯA TỪNG được thu thập kể từ khi được viết
# (phát hiện 2026-08-14, xem docs/DECISIONS.md).
#
# Hệ quả: `pytest -m slow` — chính lệnh mà cổng §E
# (`ops/readiness_gate.py`) bắt buộc chạy trước khi merge thay đổi chạm
# `core/` — thu 8 test và KHÔNG có test hồi quy mạnh nhất trong số đó.
# Cổng đã thi hành một lệnh không chứa thứ nó sinh ra để bảo vệ.
#
# Thêm pattern thay vì đổi tên file: tên `regression_harness.py` được
# nhắc ở docs/, ops/verify_scope.py và nhiều chỗ khác; đổi tên là sửa một
# tá chỗ để chiều một pattern, còn thêm pattern là nói đúng ý định.
# `tests/test_collection_scope.py` ghim để lỗ này không mở lại.
python_files = ["test_*.py", "regression_harness.py"]
# `-m 'not slow'` MẶC ĐỊNH loại test chậm khỏi mọi lần chạy thường. Chạy
# chúng bằng `pytest -m slow`.
#
# Hệ quả phải biết: `pytest tests/` KHÔNG còn là "chạy tất cả". Bộ đầy đủ
# là HAI lệnh — `pytest && pytest -m slow`. Nghiệm thu nào nói "toàn bộ
# xanh" phải chạy cả hai, nếu không nó chỉ chứng minh một nửa.
addopts = "-ra -m 'not slow'"
markers = ["slow: chạy vài phút, chỉ chạy khi gọi tường minh"]
# EM đôi khi không hội tụ ở MỘT VÀI trong n_init lần khởi tạo ngẫu nhiên —
# vô hại, select_and_train() luôn chọn lần restart có log-likelihood cao
# nhất trong số hội tụ tốt (xác nhận trực tiếp ở Phase 3: mọi model được
# CHỌN đều converged=True). Không liên quan tới numpy/scipy nói chung nên
# không che giấu lỗi số học thật ở chỗ khác.
filterwarnings = [
    "ignore:Model is not converging:UserWarning",
    "ignore:.*encountered in matmul:RuntimeWarning:sklearn",
    "ignore:.*encountered in matmul:RuntimeWarning:hmmlearn",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data/cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "broker", "data", "backtest", "monitoring"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["data/cache"]

# `tests/` được mypy kiểm như mọi nơi khác (`disallow_untyped_defs` VẪN bật),
# trừ `warn_return_any`. Lý do: phần lớn helper trong test trả thẳng kết quả
# của `yaml.safe_load`/`pd.read_csv`/`json.loads` — stub của chúng trả `Any`,
# nên cảnh báo này chỉ đòi thêm một dòng `cast()` không tăng độ an toàn nào.
#
# Trước 2026-08-14 `mypy .` DỪNG ở file đầu tiên với "Source file found twice
# under different module names" (thiếu `tests/__init__.py`) — tức là toàn bộ
# repo chưa từng được kiểm hết. Xem docstring `tests/__init__.py`.
[[tool.mypy.overrides]]
module = "tests.*"
warn_return_any = false
