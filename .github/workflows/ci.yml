# CI — cổng chất lượng chạy trên mỗi push/PR.
#
# Điểm khác một workflow pytest thông thường: `pyproject.toml` đặt
# `addopts = "-m 'not slow'"`, nên `pytest` trần KHÔNG phải là "chạy tất
# cả". Bộ đầy đủ là HAI lệnh. Job `slow` bên dưới quyết định có chạy lệnh
# thứ hai hay không bằng chính phép kiểm của cổng §E
# (`ops/readiness_gate.py`), không bằng trí nhớ của người mở PR.

name: CI

# MỌI NHÁNH, không chỉ `main`.
#
# Đổi 2026-08-15 sau khi một thí nghiệm kiểm chứng cổng §E cho ra 0 dữ
# liệu: nhánh tạm được push, và KHÔNG lần chạy CI nào xảy ra — cột Check
# status trống, lọc Actions theo nhánh ra 0 kết quả. Phép kiểm chứng trở
# nên vô hình.
#
# Lý do đổi KHÔNG phải "để chạy thí nghiệm hôm nay". Lý do là: một CI chỉ
# chạy trên `main` biến MỌI phép kiểm chứng trên nhánh tạm thành vô hình,
# nên cách duy nhất để biết một thay đổi có qua CI hay không là push thẳng
# lên `main` — tức là đúng cái việc mà nhánh tạm sinh ra để tránh.
#
# CHI PHÍ, đã ĐO chứ không đoán: 5/50 commit gần nhất chạm `core/` hoặc
# `backtest/` (10%). Job `slow-gate` chỉ chạy `pytest -m slow` (~2 phút)
# ở 10% đó; 90% còn lại nó dừng ở bước dò diff (~1 phút gồm checkout +
# cài đặt). Job `fast` chạy mọi lần, 2 phiên bản Python.
on:
  push:
    branches: ['**']
  pull_request:
  # Chạy tay từ tab Actions — cần khi muốn kiểm CI trên một commit đã có
  # sẵn mà không phải tạo commit rỗng chỉ để kích hoạt.
  workflow_dispatch:

jobs:
  fast:
    # MATRIX HAI PHIÊN BẢN, không phải một.
    #
    # 3.11 là bản `pyproject.toml` khai (`python_version`) và `CLAUDE.md`
    # §Phong cách yêu cầu. 3.9 là bản THẬT SỰ đang chạy thí nghiệm forward
    # 12 tháng: cả hai launchd job đều gọi
    # `/Users/lbeyewear/regime-trader-crypto/.venv/bin/python` = 3.9.6.
    #
    # Trước 2026-08-15, CI chỉ kiểm 3.11 — nghĩa là ĐƯỜNG CODE ĐANG SINH RA
    # DỮ LIỆU THÍ NGHIỆM chưa từng được CI kiểm lần nào. Mọi khẳng định
    # "CI xanh" đều nói về một interpreter khác với interpreter thật.
    #
    # KHÔNG nâng `.venv` để "cho khớp": nâng giữa chừng sẽ cài lại
    # numpy/hmmlearn ở phiên bản khác, đủ để đổi kết quả HMM — tức đổi
    # điều kiện của chính thí nghiệm đang chạy. Cách đúng là kiểm CẢ HAI.
    name: Bộ mặc định + lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` — nếu 3.9 đỏ và 3.11 xanh, ta cần THẤY cả hai.
      # Dừng sớm sẽ che mất việc bản kia có qua hay không, và đó chính là
      # thông tin phân biệt "lỗi của phiên bản" với "lỗi của code".
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Phiên bản công cụ ĐƯỢC GHIM (requirements-dev.txt, `==`). In ra
      # TRƯỚC khi chạy gì: lần CI đầu tiên (2026-08-14) đỏ 10 lỗi mypy mà
      # local xanh, vì hai bên cài stub khác nhau. "mypy sạch" không phải
      # khẳng định cho tới khi nói rõ sạch THEO PHIÊN BẢN NÀO.
      - name: Phiên bản công cụ
        run: |
          python -V
          mypy --version
          python -c "import importlib.metadata as m; [print(f'{p}=={m.version(p)}') for p in ('pandas-stubs','types-PyYAML','types-requests','pytest','hypothesis','ruff')]"

      - name: ruff
        run: ruff check .

      # `--python-version` theo MATRIX, không theo `pyproject.toml`.
      #
      # `pyproject.toml` giữ `python_version = "3.11"` — đó là mục tiêu
      # KHAI BÁO của dự án (CLAUDE.md §Phong cách "Python 3.11+"), và hạ
      # nó xuống 3.9 sẽ hợp thức hoá cái venv 3.9 thành mục tiêu thay vì
      # giữ nó là một khoảng trống cần đóng.
      #
      # Đo 2026-08-15: mypy SẠCH dưới CẢ 3.9 lẫn 3.11 (108 file). Nên đây
      # là phòng xa, không phải vá một lỗi đang có. Xem docs/DECISIONS.md.
      - name: mypy (theo phiên bản của job)
        run: mypy --python-version ${{ matrix.python-version }} .

      - name: pytest (mặc định, -m 'not slow')
        run: pytest -q

      # CLAUDE.md #19 — "CI xanh" mà không nói đã kiểm những gì thì không
      # phải bằng chứng. Bước này chạy SAU cùng và không được phép im lặng
      # bỏ qua: `verify_scope` thoát khác 0 nếu một đường dẫn nghiệm thu
      # không tồn tại (grep trên thư mục không có trả rỗng và trông như
      # "sạch").
      - name: PHẠM VI ĐÃ KIỂM
        run: |
          echo "── interpreter ──────────────────────────────────────"
          echo "  job này chạy Python: $(python -V 2>&1)"
          echo "  (matrix: 3.9 = bản forward test THẬT dùng qua launchd;"
          echo "           3.11 = bản pyproject/CLAUDE.md khai)"
          echo
          echo "── test đã collect ──────────────────────────────────"
          echo "mặc định (addopts = -m 'not slow'):"
          pytest --collect-only -q 2>/dev/null | tail -1
          echo "không lọc marker (TỔNG THẬT):"
          pytest --collect-only -q -m "" 2>/dev/null | tail -1
          echo
          echo "── lý do deselect ───────────────────────────────────"
          # `grep` chứ không `tomllib`: tomllib là 3.11+, và máy dev của
          # dự án đang chạy 3.9 — một dòng chỉ chạy được trên CI là một
          # dòng không ai kiểm được trước khi push.
          echo "pyproject.toml addopts:"
          grep -n "^addopts" pyproject.toml
          echo "  -> test mang marker \`slow\` bị loại khỏi lệnh mặc định;"
          echo "     chúng chạy ở job slow-gate bên dưới, KHÔNG bị bỏ."
          echo
          echo "── skip / xfail (phải là 0) ─────────────────────────"
          pytest -q -rs 2>/dev/null | grep -cE "^SKIPPED|^XFAIL" || echo "  0"
          echo
          echo "── phạm vi ruff / mypy / đường dẫn nghiệm thu ───────"
          python ops/verify_scope.py

  slow-gate:
    name: Cổng §E — test chậm khi chạm tầng quyết định
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — cổng chạy `git diff <base>..HEAD`; một bản
      # checkout nông không có `base` để so, và cổng sẽ hỏng theo kiểu
      # "không kiểm được" thay vì "kiểm và cho qua". Đó là khác biệt quan
      # trọng nhất trong file này.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Phiên bản công cụ
        run: |
          python -V
          mypy --version
          python -c "import importlib.metadata as m; [print(f'{p}=={m.version(p)}') for p in ('pandas-stubs','pytest','hypothesis','ruff')]"

      # ══════════════════════════════════════════════════════════════
      # BƯỚC CHẨN ĐOÁN TẠM — CHỈ TỒN TẠI TRÊN NHÁNH test-cong-e-doi-core.
      # Xoá trước khi merge. Mục đích: phân biệt dứt khoát hai giả thuyết
      # về việc vì sao cổng §E không bao giờ kích hoạt.
      #   H1: `github.event.before` = 40 số 0 (push đầu vào nhánh)
      #   H2: BASE không tồn tại trong clone của runner
      # Mọi lệnh đều được bọc để bước này KHÔNG BAO GIỜ làm job đỏ — nó chỉ
      # quan sát, không phán xét.
      # ══════════════════════════════════════════════════════════════
      - name: CHẨN ĐOÁN (tạm) — clone của runner có gì
        run: |
          echo "── sự kiện ──"
          echo "  event_name          = ${{ github.event_name }}"
          echo "  event.before        = '${{ github.event.before }}'"
          echo "  event.after         = '${{ github.event.after }}'"
          echo "  pull_request.base   = '${{ github.event.pull_request.base.sha }}'"
          echo "  github.sha          = '${{ github.sha }}'"
          echo
          echo "── clone sâu bao nhiêu ──"
          echo "  số commit trong clone: $(git rev-list --count HEAD 2>&1 || echo 'REV-LIST FAIL')"
          echo "  có phải shallow không: $(git rev-parse --is-shallow-repository 2>&1 || echo '?')"
          echo
          echo "── 5 commit đầu ──"
          git log --oneline -5 2>&1 | sed 's/^/    /' || echo "    LOG FAIL"
          echo
          echo "── BASE có resolve được không ──"
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ]; then
            echo "    BASE RỖNG"
          elif [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "    BASE = 40 SỐ 0  -> H1 ĐÚNG"
          elif git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "    BASE resolve OK  -> H2 SAI, tìm nguyên nhân khác"
          else
            echo "    BASE KHONG TON TAI trong clone  -> H2 ĐÚNG"
          fi
          echo
          echo "── git diff thật sự trả về gì ──"
          if git diff --name-only "$BASE..HEAD" > /tmp/d.txt 2>/tmp/e.txt; then
            echo "    git diff THÀNH CÔNG, $(wc -l < /tmp/d.txt) file:"
            sed 's/^/      /' /tmp/d.txt
          else
            echo "    git diff THẤT BẠI (mã thoát khác 0). stderr:"
            sed 's/^/      /' /tmp/e.txt
          fi
          echo
          echo "── và đây là lý do bước dò diff cũ không thấy gì ──"
          n=$(git diff --name-only "$BASE..HEAD" 2>/dev/null | grep -cE '^(core|backtest)/' || true)
          echo "    n = '$n'   <- grep -c in ra 0 kể cả khi git diff chết"

      - name: Xác định mốc so sánh
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Push thẳng lên main: so với commit ngay trước.
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff có chạm core/ hoặc backtest/ không?
        id: scope
        run: |
          set -o pipefail
          # KHÔNG đọc exit code sau pipe (CLAUDE.md #17) — `grep` không tìm
          # thấy trả 1, và ở đây "không tìm thấy" là kết quả HỢP LỆ, không
          # phải lỗi. Đếm dòng thay vì đọc mã thoát.
          n=$(git diff --name-only "${{ steps.base.outputs.ref }}..HEAD" \
              | grep -cE '^(core|backtest)/' || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "File trong phạm vi cổng: $n"

      - name: pytest -m slow (BẮT BUỘC khi diff chạm tầng quyết định)
        if: steps.scope.outputs.n != '0'
        run: |
          echo "── test slow sẽ chạy ────────────────────────────────"
          pytest --collect-only -q -m slow 2>/dev/null | tail -1
          pytest -m slow -q

      - name: Cổng §E
        if: steps.scope.outputs.n != '0'
        run: python ops/readiness_gate.py --base "${{ steps.base.outputs.ref }}"

      - name: Bỏ qua (diff không chạm tầng quyết định)
        if: steps.scope.outputs.n == '0'
        run: echo "Diff không chạm core/ hay backtest/ — slow không bắt buộc."
