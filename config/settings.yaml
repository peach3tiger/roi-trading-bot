# Toàn bộ tham số của hệ thống, nhóm theo section.
# Không magic number trong code — nếu một con số có thể cần chỉnh, nó
# thuộc về file này (xem CLAUDE.md bất biến #14).

exchange:
  # Đổi ngày 2026-08-06: bybit -> binance (qua ccxt). Bybit chặn theo khu
  # vực (regulatory restrictions, retCode 10024) — không kết nối được cả
  # testnet lẫn mainnet từ môi trường vận hành. Xem docs/DECISIONS.md,
  # mục "Đổi sàn Bybit -> Binance (ccxt)". broker/bybit_client.py giữ lại
  # (deprecated) làm bằng chứng, không xoá.
  name: binance
  category: spot              # spot | linear (linear = perps, Phase 10) —
                               # thuật ngữ riêng của Bybit, KHÔNG được
                               # broker/ccxt_client.py::CCXTClient đọc; nó
                               # tự phân biệt spot/swap qua ký hiệu hợp
                               # nhất của ccxt ("BTC/USDT" vs
                               # "BTC/USDT:USDT", xem _to_ccxt_symbol()).
                               # Giữ lại chỉ để ghi phạm vi dự án (spot,
                               # không leverage).
  testnet: true                # LUÔN true khi bắt đầu — CCXTClient gọi
                                # exchange.set_sandbox_mode(True) khi cờ
                                # này bật, KHÔNG có field "sandbox" riêng
                                # (xem broker/ccxt_client.py __init__: tên
                                # tham số `testnet`, khớp CLAUDE.md #6 và
                                # mọi chỗ đã dùng tên này — ops/health_check.py,
                                # ops/RUNBOOK.md — thêm field "sandbox"
                                # trùng nghĩa chỉ để đúng tên gợi ý ban đầu
                                # sẽ tạo ra hai nguồn sự thật cho cùng một
                                # khái niệm, dễ lệch nhau).
  symbol: BTCUSDT
  quote_asset: USDT
  timeframe: "1D"              # bar đóng 00:00 UTC
  recv_window_ms: 5000          # Bybit-specific (recv_window), KHÔNG được
                                 # CCXTClient đọc — giữ lại cho
                                 # broker/bybit_client.py (deprecated).

# Phase 10 (main.py live loop) — broker/order_executor.py::OrderExecutor và
# vòng lặp poll REST. Thêm 2026-08-07, chưa có field nào ở đây trước đó
# (CLAUDE.md bất biến #14 — không magic number ngoài config).
execution:
  limit_offset_pct: 0.05        # LIMIT đặt lệch ±0.05% quanh giá hiện tại,
                                 # xem broker/order_executor.py::submit_order
  order_timeout_seconds: 30     # huỷ nếu chưa khớp sau chừng này
  poll_interval_seconds: 60     # main loop hỏi lại REST xem đã có bar mới
                                 # đóng chưa, mỗi chừng này giây — bar 1D
                                 # nên không cần tần suất cao, xem
                                 # docs/DECISIONS.md "Đổi sàn Bybit ->
                                 # Binance (ccxt)" mục REST polling

costs:
  taker_fee_pct: 0.10          # Bybit spot VIP0, XÁC MINH LẠI trước khi live
  maker_fee_pct: 0.10
  slippage_pct: 0.03
  assume_taker: true           # bảo thủ: giả định luôn khớp taker

hmm:
  n_candidates: [3, 4, 5, 6, 7]
  n_init: 10
  covariance_type: full
  min_train_bars: 730          # 2 năm × 365 ngày
  zscore_lookback: 365         # KHÔNG phải 252
  retrain_interval_days: 7
  stability_bars: 3
  flicker_window: 20
  flicker_threshold: 4
  # Gốc dãy random_state cho n_init lần khởi tạo GaussianHMM. KHÔNG phải
  # để chỉnh: nó tồn tại để tính tất định được KHAI BÁO thay vì tình cờ
  # đúng. Đổi giá trị này làm MỌI baseline đã đo hết hiệu lực cùng lúc
  # (reports/pruned8_base, tests/snapshots/) — xem tests/test_determinism.py
  # và docstring HMMRegimeEngine.__init__.
  seed: 0

features:
  tier1_ohlcv: true              # bắt buộc
  tier2_derivatives: false       # bật sau khi tier1 đã validate
  tier3_temporal: false          # cẩn trọng — dễ overfit
  use_trade_count_not_volume: true

trend_gate:
  enabled: true
  sma_period: 200
  slope_lookback: 30
  buffer_pct: 2.0                # dải chết quanh SMA200
  confirm_bars: 5                # chậm hơn HMM (3) một cách có chủ đích
  cap_bull_structure: 1.00
  cap_transition: 0.60
  cap_bear_structure: 0.30

strategy:
  min_confidence: 0.55
  rebalance_threshold_pct: 25  # KHÔNG phải 10
  max_allocation: 1.00         # spot: không vượt 1.0
  low_vol_allocation: 0.95
  mid_vol_allocation_trend_ok: 0.95
  mid_vol_allocation_trend_broken: 0.60
  high_vol_allocation: 0.50    # thấp hơn equities (0.60)
  uncertainty_size_multiplier: 0.5

risk:
  max_position_pct: 100        # một tài sản duy nhất
  max_risk_per_trade_pct: 1.0
  min_order_value_usdt: 5      # > mức tối thiểu 1 USDT của sàn, có biên
  min_cash_buffer_pct: 5.0     # §5.1 — giữ USDT trả phí + lệnh khớp một phần
  max_trades_per_day: 6        # thấp hơn nhiều so với 20 của equities — phí cao hơn
  max_leverage: 1.0            # spot, cứng — không có margin
  spread_max_pct: 0.10         # §5.4 — BTC/USDT bình thường < 0.02%
  usdt_depeg_threshold_pct: 0.5  # §5.4 — tạm dừng lệnh mới nếu lệch peg quá mức này
  duplicate_order_window_seconds: 60  # §5.5 — chặn lệnh trùng symbol+hướng trong cửa sổ này
  circuit_breaker:
    # Hiệu chỉnh bằng phân vị phân phối lợi nhuận ngày/tuần thật từ
    # reports/pruned8_base/equity_curve.csv (Phase 6, 2290 bar, 2018-02-09
    # → 2026-08-04) — KHÔNG phải số mặc định đoán, xem docs/DECISIONS.md
    # "Hiệu chỉnh ngưỡng circuit breaker (Phase 8)" cho toàn bộ phân vị đã
    # in ra và cách tính. Quy tắc: "giảm size" ở phân vị 2-3%, "dừng" ở
    # phân vị 0.5% (Brain-Crypto-Bybit.md §5.2).
    daily_dd_reduce_pct: 3.85   # |p2.5 daily return| — mặc định gốc 4.0, xấp xỉ
    daily_dd_halt_pct: 6.34     # |p0.5 daily return| — mặc định gốc 6.0
    weekly_dd_reduce_pct: 9.48  # |p2.5 weekly(7d) return| — mặc định gốc 10.0
    weekly_dd_halt_pct: 13.72   # |p0.5 weekly(7d) return| — mặc định gốc 14.0
    # peak_dd_halt_pct KHÔNG hiệu chỉnh bằng phân vị — đây là trần tuyệt
    # đối toàn kỳ (spec §5.2), không phải phân vị của một cửa sổ ngày/tuần.
    # Giữ 20.0 theo spec: max drawdown lịch sử thật của hệ thống là -54.80%
    # (docs/VALIDATION_REPORT.md) nên 20% sẽ kích hoạt sớm, đúng vai trò
    # "phanh khẩn cấp" chứ không phải ngưỡng đo bằng thống kê thông thường.
    peak_dd_halt_pct: 20.0
    day_boundary_utc: "00:00"

backtest:
  is_bars: 365                 # in-sample 1 năm
  oos_bars: 182                # out-of-sample 6 tháng
  step_bars: 182
  fill_delay_bars: 1

# Phase 11 (monitoring/logger.py, monitoring/dashboard.py, monitoring/alerts.py)
# — thêm 2026-08-07, chưa có field nào ở đây trước đó (CLAUDE.md bất biến
# #14). Credential Telegram/email KHÔNG nằm ở đây — đọc từ .env
# (TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID), xem monitoring/alerts.py::AlertManager.
monitoring:
  log_dir: "logs"                    # main.log/trades.log/alerts.log/regime.log
  dashboard_refresh_seconds: 5       # §8.2
  alert_rate_limit_seconds: 900      # 1 cảnh báo / loại sự kiện / 15 phút, §8.3
  # Cảnh báo SỚM HƠN circuit_breaker.daily_dd_reduce_pct (3.85, xem risk.circuit_breaker
  # ở trên) — một tín hiệu "chú ý" trước khi breaker thật sự can thiệp vào
  # allocation. CHỈ phát hiện chiều LỖ (đọc từ CircuitBreaker.check().daily_dd,
  # vốn chỉ đo drawdown) — chưa có theo dõi equity tăng bar-over-bar để phát
  # hiện P&L DƯƠNG lớn, xem docs/STATE.md mục Phase 11 cho khoảng trống này.
  # HIỆU CHỈNH BẰNG PHÂN VỊ 2026-08-14 (CLAUDE.md #18): 2.0 -> 2.93.
  # 2.0 là số tròn đặt bằng trực giác; đo trên 1135 bar LỖ của
  # tests/snapshots/phase7_baseline/equity_curve.csv thì nó nằm ở phân vị
  # 82.4 và phát 32.0 lần/năm — gấp 3.5 lần chính circuit breaker mà nó
  # cảnh báo trước (3.85, 9.2 lần/năm). 2.93 = p90 -> 18.2 lần/năm = 2.0x
  # breaker: đủ dày để có ích, đủ thưa để mỗi lần phát còn nghĩa lý.
  # Toàn bộ bảng phân vị ở docs/DECISIONS.md mục "ĐO #1".
  large_pnl_alert_pct: 2.93
  # Lệch đồng hồ (monitoring/clock.py::measure_clock_drift(), hiệu chỉnh
  # round-trip — KHÔNG dùng công thức ngây thơ, xem docstring module đó).
  # 1000ms: cảnh báo (rate limit chung 15 phút như mọi AlertType khác).
  # 2500ms: dừng gửi lệnh mới, giữ nguyên vị thế/stop hiện có tới khi đo
  # lại thấy đồng hồ đã đồng bộ — Binance recvWindow mặc định 5000ms, vượt
  # QUÁ NỬA cửa sổ đó thì request ký bắt đầu bị từ chối với -1021 (trông
  # hệt như key sai, xem ops/RUNBOOK.md mục CLOCK_DRIFT).
  clock_drift_alert_ms: 1000
  clock_drift_halt_ms: 2500
  # monitoring/health.py §B.1 — lệnh chưa khớp lâu hơn chừng này giây thì
  # health.json xuống "degraded". KHÁC execution.order_timeout_seconds (30,
  # sau đó OrderExecutor HUỶ lệnh): ngưỡng này nói "một lệnh lẽ ra đã phải
  # được huỷ từ lâu mà vẫn còn treo" — tức là dấu hiệu vòng huỷ không chạy,
  # không phải dấu hiệu thị trường chậm khớp. Để bằng 30 sẽ báo degraded ở
  # mọi lệnh bình thường đang chờ trong cửa sổ timeout của chính nó.
  unfilled_order_degraded_seconds: 300
  # monitoring/drift.py §C.1 — ngưỡng cảnh báo trôi lệch so với baseline
  # backtest Phase 7 (tests/snapshots/phase7_baseline/). BẢN THÂN baseline
  # KHÔNG nằm ở đây: nó là kết quả ĐO, đọc từ file, không phải tham số
  # chỉnh được — xem docstring monitoring/drift.py.
  drift:
    allocation_pts: 15.0        # bất kỳ mức nào trong 4 mức lệch quá chừng này điểm %
    rebalance_pts: 10.0
    fee_pct_of_gross_max: 20.0  # TUYỆT ĐỐI, không so baseline: phí ăn 20%
                                 # lợi nhuận gộp là xấu bất kể baseline bao nhiêu
    flicker_multiple: 2.0       # cao hơn baseline chừng này lần
    trend_gate_block_pts: 20.0
